name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The suite mocks every outbound request, so it must pass with no network.
      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          python -m pi --help
          python -m pi run --help
