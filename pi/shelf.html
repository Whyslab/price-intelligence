<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скидки</title>
<!-- Deferred on purpose: it is only needed to sit nicely inside Telegram, and
     as a blocking script it holds up the whole shelf whenever telegram.org is
     slow — which, on a phone on a bad connection, is often. Everything below
     treats it as optional. -->
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1917; --dim:#78716c; --faint:#a8a29e;
  --line:#e7e5e4; --chip:#f5f5f4; --accent:#15803d; --hot:#be123c;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c0a09; --card:#1c1917; --ink:#fafaf9; --dim:#a8a29e; --faint:#78716c;
         --line:#2c2725; --chip:#262220; --accent:#4ade80; --hot:#fb7185;
         --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}

/* --- шапка --- */
header{position:sticky;top:0;z-index:20;background:var(--bg);
       border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;max-width:1400px;margin:0 auto;
     flex-wrap:wrap}
/* On a phone the search, the filter button, the sort and the count do not fit
   on one line, and flexbox resolved that by crushing the search into a 40px
   square. It takes the whole first row instead and the controls sit under it. */
.field{flex:1 1 100%;position:relative;min-width:0;order:-1}
@media (min-width:560px){ .field{flex:1 1 auto;order:0} }
.field input{width:100%;background:var(--card);border:1px solid var(--line);
             border-radius:10px;padding:9px 32px 9px 12px}
.field button{position:absolute;right:4px;top:50%;transform:translateY(-50%);
              border:none;background:none;color:var(--faint);font-size:18px;
              padding:2px 6px;cursor:pointer}
.tool{flex:0 0 auto;background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tool[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Почему нет сердечек — только в обычном браузере, где об этом иначе не узнать. */
.nofav{max-width:1400px;margin:0 auto;padding:0 12px 8px;font-size:12px;color:var(--dim)}
.nofav code{font-size:11px}
.tool .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;
         border-radius:9px;background:var(--hot);color:#fff;font-size:12px;text-align:center}
/* display on the class would otherwise beat the hidden attribute, and the
   badge would sit there reading "0". */
[hidden]{display:none !important}
select.tool{padding-right:8px}
.count{color:var(--dim);font-size:13px;white-space:nowrap;padding-right:2px}

/* --- активные фильтры одной строкой --- */
.active{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;max-width:1400px;margin:0 auto}
.active:empty{display:none}
.tag{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--ink);
     color:var(--bg);border:none;border-radius:999px;padding:4px 8px 4px 11px;
     font-size:12.5px;cursor:pointer;white-space:nowrap}
.tag b{font-weight:600}
.tag i{font-style:normal;opacity:.6;font-size:14px;line-height:1}
.tag.reset{background:none;color:var(--hot);border:1px solid var(--hot);padding:4px 11px}

/* --- панель фильтров --- */
.panel{display:none;border-top:1px solid var(--line);background:var(--card)}
.panel.open{display:block}
.panel .inner{max-width:1400px;margin:0 auto;padding:12px 12px 14px;
              max-height:min(62vh,560px);overflow-y:auto}
.group{margin-bottom:14px}
.group:last-child{margin-bottom:0}
.group h3{margin:0 0 7px;font-size:11.5px;font-weight:600;letter-spacing:.06em;
          text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;
      padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.5;margin-left:4px;font-size:11.5px}
.chip.hl{border-color:var(--accent);color:var(--accent);background:transparent}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input{width:96px;background:var(--bg);border:1px solid var(--line);
             border-radius:9px;padding:7px 10px}
.range span{color:var(--faint);font-size:13px}
.mine-link{border:1px solid var(--line);background:none;color:var(--dim);
  font-size:11.5px;font-weight:500;margin-left:8px;padding:2px 8px;border-radius:99px;
  cursor:pointer;vertical-align:middle}
.mine-link:hover{color:var(--ink);border-color:var(--ink)}
.mine-link.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.more-link{border:none;background:none;color:var(--dim);font-size:12.5px;
           cursor:pointer;padding:5px 2px;text-decoration:underline}

/* --- сетка ---
   Шире, чем было: на 168px карточка на ноутбуке выходила размером с иконку, а
   вещь выбирают глазами. */
/* 150px so a 390px phone gets two columns. At 206 it got one, and one card of
   seven hundred pixels means one product per screenful — which is how a shelf
   of five thousand things comes to feel empty. */
main{display:grid;gap:10px;padding:12px 12px 8px;max-width:1400px;margin:0 auto;
     grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:560px){ main{gap:16px;padding:16px 14px 8px;
     grid-template-columns:repeat(auto-fill,minmax(206px,1fr))} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;display:flex;flex-direction:column;text-decoration:none;
      color:inherit;transition:box-shadow .18s,transform .18s,border-color .18s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--faint)}
/* Портрет, а не квадрат: кроссовок и куртка снимаются вертикально, и квадрат
   у них отрезает то носок, то капюшон. И `contain`, а не `cover` — магазины
   снимают на белом, обрезка ради заполнения портит именно те кадры, которые
   изначально были хорошими. */
/* Square, not portrait. Portrait plus `contain` left a product shot swimming in
   white — the photographs are not all the same shape, and the taller the box the
   more of it is empty. */
/* `min-height:0` и абсолютная картинка — иначе собственная высота фотографии
   участвует в расчёте флекс-элемента и перебивает `aspect-ratio`: измерено,
   превью выходили 248, 294 и 314 пикселей при ширине 236, и сетка ехала. */
.thumb{aspect-ratio:1;background:#fff;position:relative;flex:0 0 auto;min-height:0}
@media (prefers-color-scheme: dark){ .thumb{background:#17140f} }
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
/* Бейдж скидки спокойный, без цвета. Сначала красным метились скидки от 50% —
   и это была ошибка калибровки: правило подбиралось на полке, где лежали и
   мелкие фальшивые уценки. Когда полка стала честной, на ней почти всё глубже
   70%, и красным залило всё подряд — ровно то, от чего уходили.

   Цвет остался за тем, что действительно редкость: зелёная метка «минимум»,
   то есть цена ниже всего, что мы когда-либо видели у этого товара. */
.badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);
       color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;
       font-weight:700;backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){ .badge{background:rgba(28,25,23,.9);color:var(--ink)} }
/* Внизу слева на картинке: верхний правый угол занят сердечком, и там они
   перекрывали друг друга (замечено 18.09). */
.low{position:absolute;bottom:8px;left:8px;background:var(--accent);color:#fff;
     border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;
     letter-spacing:.02em}
/* Сама плитка — ссылка, и вкладывать в неё кнопку нельзя. Поэтому обёртка:
   карточка внутри, сердечко рядом, поверх угла картинки. */
.wrap{position:relative;display:flex}
.wrap > .card{flex:1;min-width:0}
/* Сердечко — единственная кнопка на витрине, которая что-то записывает.
   Вверху справа; «минимум» для этого живёт внизу слева. */
.heart{position:absolute;top:6px;right:6px;width:30px;height:30px;border:none;
  border-radius:50%;background:rgba(255,255,255,.82);color:#57534e;font-size:15px;
  line-height:30px;padding:0;cursor:pointer;backdrop-filter:blur(3px)}
.heart.on{background:var(--hot);color:#fff}
.heart:disabled{opacity:.45;cursor:progress}
@media (prefers-color-scheme: dark){ .heart{background:rgba(28,25,23,.8);color:#d6d3d1} }
.fav-line{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--dim)}
.fav-line b{color:var(--accent);font-weight:600}
.gone{color:var(--faint)}
/* Сердечко в карточке товара и в строках «пробить по магазинам» */
.heart-inline{border:1px solid var(--line);background:var(--chip);border-radius:8px;
  padding:3px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.heart-inline.on{background:var(--hot);border-color:var(--hot);color:#fff}
.body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.brand{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
       font-weight:600;color:var(--dim)}
.name{font-size:13.5px;line-height:1.34;display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden;color:var(--dim)}
/* Цена — то, ради чего сюда пришли, и раньше она была набрана тем же кеглем,
   что и всё остальное. Табличные цифры, чтобы колонка цен читалась колонкой. */
.prices{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
        margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}
.now{font-size:17px;font-weight:700;letter-spacing:-.01em}
.then{color:var(--faint);text-decoration:line-through;font-size:12.5px}
/* Сэкономленное — самый убедительный аргумент на карточке, и он стоял внизу
   самым мелким шрифтом. Теперь рядом с ценой. */
.save{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);
      white-space:nowrap}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;
      color:var(--faint);padding-top:2px}
.stale{color:var(--hot)}
#more{display:block;margin:14px auto 44px;padding:11px 28px;background:var(--card);
      border:1px solid var(--line);border-radius:11px;cursor:pointer}
.empty{padding:56px 16px;text-align:center;color:var(--dim);grid-column:1/-1;line-height:1.7}
/* Пейвол рисуется этой же страницей: решить, показывать ли его, можно только
   там, где есть подпись Telegram, а она приезжает во фрагменте адреса. */
.locked{grid-column:1/-1;max-width:34rem;margin:40px auto;padding:0 4px;line-height:1.6}
.locked h2{font-size:1.35rem;margin:0 0 .5rem}
.locked p{color:var(--dim);margin:.6rem 0}
.locked b{color:var(--ink)}
.locked button{margin-top:18px;width:100%;padding:13px;border:none;border-radius:11px;
  background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
/* Полка — это то, что подешевело. Каталог — всё, что вообще есть. Второй
   вопрос задают редко, поэтому он строкой, а не второй строкой поиска. */
#whole{max-width:1400px;margin:0 auto;padding:8px 12px 0}
#whole button{background:none;border:0;padding:6px 0;cursor:pointer;
  color:var(--accent);font-size:14px;text-align:left}
#whole button:hover{text-decoration:underline}
.skeleton{grid-column:1/-1;padding:40px;text-align:center;color:var(--faint)}

/* --- карточка товара --- */
dialog{border:none;border-radius:16px;padding:0;max-width:560px;
       width:calc(100% - 20px);background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{padding:18px 18px 18px;position:relative}
.sheet h2{margin:0 0 3px;font-size:17px;line-height:1.3}
.hero{display:flex;gap:13px;margin-bottom:13px}
.hero img{width:106px;height:106px;object-fit:cover;border-radius:10px;
          background:var(--chip);flex:0 0 auto}
.big{font-size:23px;font-weight:700}
.verdict{margin:11px 0 13px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.verdict.best{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.verdict.beaten{background:color-mix(in srgb,var(--hot) 13%,transparent)}
.verdict.alone{background:var(--chip);color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 2px;border-top:1px solid var(--line);vertical-align:baseline}
td.p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.us td{font-weight:700}
tr.cheap td.p{color:var(--accent);font-weight:600}
.sizes{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 4px}
/* История цены: ступеньки, как цена и менялась, в валюте магазина. */
.hist{margin:12px 0 4px}
.hist-head{font-size:12px;color:var(--dim);margin-bottom:4px}
.hist svg{width:100%;height:88px;display:block;color:var(--accent);
  background:var(--chip);border-radius:10px}
.hist-foot{display:flex;justify-content:space-between;gap:8px;font-size:11px;
  color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}
.sz{border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12px}
.sz.out{opacity:.32;text-decoration:line-through}
.go{display:block;text-align:center;margin-top:15px;padding:12px;border-radius:11px;
    background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.close{position:absolute;top:10px;right:12px;border:none;background:none;
       color:var(--faint);font-size:26px;line-height:1;cursor:pointer}
</style>

<header>
  <div class="bar">
    <span class="field">
      <input type="search" id="q" placeholder="Поиск: nike, cargo, carhartt…" autocomplete="off">
      <button id="q-clear" hidden aria-label="Очистить">×</button>
    </span>
    <button class="tool" id="fav" hidden aria-pressed="false" title="Избранное">★<span class="n" id="favcount" hidden></span></button>
    <button class="tool" id="toggle" aria-expanded="false">Фильтры<span class="n" id="fcount" hidden></span></button>
    <select class="tool" id="sort" aria-label="Сортировка">
      <option value="score">Лучшие</option>
      <option value="discount">Больше скидка</option>
      <option value="saving">Больше экономия</option>
      <option value="cheapest">Дешевле</option>
      <option value="newest">Новее</option>
      <option value="freshest">Свежее проверено</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <p class="nofav" id="nofav" hidden>Сердечек нет: страница не знает, кто смотрит. Они есть в
    Telegram и при запуске <code>pi web --owner &lt;ваш Telegram id&gt;</code>.</p>
  <div class="active" id="active"></div>
  <div class="panel" id="panel"><div class="inner">
    <div class="group">
      <h3>Цена, $</h3>
      <div class="range">
        <input type="number" id="pmin" min="0" placeholder="от" inputmode="numeric">
        <span>—</span>
        <input type="number" id="pmax" min="0" placeholder="до" inputmode="numeric">
        <span id="prange"></span>
      </div>
    </div>
    <div class="group"><h3>Скидка не меньше</h3><div class="chips" id="f-disc"></div>
      <div class="chips" id="f-evidence"></div></div>
    <div class="group"><h3>Что</h3><div class="chips" id="f-kind"></div></div>
    <div class="group"><h3>Кому</h3><div class="chips" id="f-gender"></div>
      <div class="chips" id="f-kids"></div></div>
    <div class="group"><h3>Размер<button class="mine-link" id="mine-size" hidden>только мои</button></h3>
      <div class="chips" id="f-size"></div>
      <button class="more-link" id="more-size" hidden>Все размеры</button></div>
    <div class="group"><h3>Марка</h3><div class="chips" id="f-brand"></div>
      <button class="more-link" id="more-brand" hidden>Все марки</button></div>
  </div></div>
</header>

<script type="application/json" id="seed">{"seed": null}</script>
<div id="whole" hidden></div>
<main id="grid"><div class="skeleton">Открываю полку…</div></main>
<button id="more" hidden>Показать ещё</button>
<dialog id="sheet"><button class="close" id="x" aria-label="Закрыть">×</button>
  <div class="sheet" id="sheet-body"></div></dialog>

<script>
addEventListener("load", () => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  // После него, потому что подпись приходит вместе с этим скриптом.
  identity();
});

const KIND_RU = {shoes:"Обувь", clothing:"Одежда", accessories:"Аксессуары"};
const GENDER_RU = {men:"Мужское", women:"Женское"};
const DISCOUNTS = [30, 40, 50, 60, 70];
const SHOWN = 18;            // сколько чипов показывать до «все»
const STORE = "shelf.filters";

const el = id => document.getElementById(id);
const money = n => "$" + (n < 100 ? n.toFixed(2) : Math.round(n));
// «26 магазин(ов)» — след разработчика в тексте, который читает человек.
const plural = (n, one, few, many) => {
  const t = Math.abs(n) % 100, u = t % 10;
  return n + " " + (t > 10 && t < 20 ? many : u === 1 ? one : u > 1 && u < 5 ? few : many);
};
// The server already refuses anything that is not a web page; this is the
// second lock, because a card's link is written by a shop, not by us.
const safe = u => /^https?:\/\//i.test(String(u ?? "")) ? u : "#";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* --- избранное: единственное, что эта страница записывает --- */
// Подпись Telegram уходит с каждым запросом. Ни сессии, ни куки: нечему
// протухнуть в хранилище и нечего у страницы украсть.
const tg_headers = () => {
  const d = window.Telegram?.WebApp?.initData;
  return d ? {"X-Telegram-Init-Data": d} : {};
};

/* Читать подписывается ровно так же, как писать. Подпись раньше уходила только
   с избранным, а полка — то, что продаётся, — запрашивалась анонимно и получала
   402. Снаружи это выглядело как «подписка есть, а полка закрыта». */
const LOCKED = Symbol("нужна подписка");
async function api(url){
  const r = await fetch(url, {headers: tg_headers()});
  if (r.status === 402) return LOCKED;
  if (!r.ok) throw new Error(url + " → " + r.status);
  return r.json();
}

/* Пейвол живёт здесь, а не на отдельной странице, потому что решить, показывать
   ли его, можно только там, где есть подпись, — а подпись Telegram приезжает во
   фрагменте адреса, которого браузер серверу не отправляет. */
function show_paywall(){
  document.querySelector("header").hidden = true;
  el("more").hidden = true;
  el("grid").innerHTML = `<div class="locked">
    <h2>💎 Полка открывается по подписке</h2>
    <p>Это всё, что подешевело прямо сейчас: поиск по размеру и марке,
       сравнение цены между магазинами и цена на руках — с доставкой и пошлиной.</p>
    <p><b>150 звёзд в месяц</b> или 1500 за год — два месяца в подарок.</p>
    <button id="back">Вернуться в бота и оформить</button>
  </div>`;
  el("back").onclick = async () => {
    /* Кнопка обещает «вернуться в бота и оформить», а раньше только закрывала
     * окно: человек оказывался в чате, где ничего не происходило. Теперь
     * сначала просим бота положить туда предложение, и только потом уходим —
     * иначе возвращаться не к чему. */
    const b = el("back");
    b.disabled = true;
    const was = b.textContent;
    b.textContent = "Открываю…";
    try {
      await fetch("/api/pitch", { method: "POST", headers: tg_headers() });
    } catch (e) {
      /* Не дозвонились — всё равно закрываем: держать человека в тупике хуже,
       * чем вернуть его в чат без сообщения. */
    }
    b.textContent = was;
    const tg = window.Telegram?.WebApp;
    if (tg?.close) tg.close(); else history.back();
  };
}

function announce(user, ids){
  me = user;
  starred = new Set(ids);
  el("fav").hidden = false;
  draw_fav_count();
  for (const b of document.querySelectorAll(".heart")) b.hidden = false;
  paint_hearts();
}

async function identity(){
  // Спрашивается один раз, и только если сервер не назвал читателя сам.
  // 401 значит «этот человек нам не представлен» — тогда сердечек нет вовсе:
  // кнопка, которая отвечает отказом, хуже её отсутствия.
  if (me === null){
    let r;
    try { r = await fetch("/api/favorites", {headers: tg_headers()}); } catch { return; }
    if (!r.ok){
      // 13.09 сердечки «пропали» у того, кто открыл полку командой без
      // --owner, — и страница никак не сказала почему. Внутри Telegram
      // подсказка не нужна: там это отказ, а не забытый ключ.
      if (r.status === 401 && !window.Telegram?.WebApp?.initData) el("nofav").hidden = false;
      return;
    }
    const d = await r.json();
    announce(d.user, d.items.map(i => i.id));
    // Лист, открытый по ссылке из бота, успел нарисоваться без сердечка.
    if (el("sheet").open && reopen) reopen();
  }
  if (state.view !== "fav" && new URLSearchParams(location.search).get("favorites") === "1"){
    state.view = "fav";
    reload();
  }
}

function draw_fav_count(){
  el("favcount").hidden = starred.size === 0;
  el("favcount").textContent = starred.size;
}

function paint_heart(b){
  const on = starred.has(Number(b.dataset.heart));
  b.classList.toggle("on", on);
  b.setAttribute("aria-pressed", String(on));
  b.textContent = b.classList.contains("heart-inline")
    ? (on ? "♥ слежу" : "♡ следить")
    : (on ? "♥" : "♡");
}

function wire_hearts(root){
  for (const b of root.querySelectorAll("[data-heart]")){
    const id = Number(b.dataset.heart), v = Number(b.dataset.variant) || null;
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); toggle_star(id, v, b); };
    paint_heart(b);
  }
}

const paint_hearts = () => wire_hearts(document);

function heart_button(id, variant){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "heart";
  b.dataset.heart = id;
  if (variant) b.dataset.variant = variant;
  b.setAttribute("aria-label", "Следить за ценой");
  // Первый экран рисуется из зерна в HTML, раньше, чем Telegram отвечает, кто
  // смотрит. Сердечко ставится сразу и показывается, когда ответ придёт.
  b.hidden = me === null;
  return b;
}

const heart_inline = (id, variant) => me === null ? "" :
  `<button type="button" class="heart-inline" data-heart="${id}"${
    variant ? ` data-variant="${variant}"` : ""}>♡ следить</button>`;

async function toggle_star(id, variant, button){
  if (me === null) return;
  const on = starred.has(id);
  button.disabled = true;
  try {
    const r = on
      ? await fetch("/api/favorites/" + id, {method:"DELETE", headers: tg_headers()})
      : await fetch("/api/favorites", {
          method:"POST",
          headers: {...tg_headers(), "Content-Type":"application/json"},
          body: JSON.stringify({product_id:id, variant_id:variant || null}),
        });
    if (!r.ok) return;
    on ? starred.delete(id) : starred.add(id);
    draw_fav_count();
    // Список перерисовывается целиком: снятое сердечко должно убрать вещь из
    // него, а не оставить строку, которой там уже нет.
    if (state.view === "fav") load_favorites(); else paint_hearts();
  } catch {} finally { button.disabled = false; }
}

const state = {kind:new Set(), gender:new Set(), size:new Set(), brand:new Set(),
               q:"", min_price:"", max_price:"", min_discount:"", kids:false,
               all_discounts:false,
               sort:"score", page:0, view:"shelf"};
let facets = null, expanded = {size:false, brand:false};
// Кто смотрит. null — никто: страница открыта не из Telegram и без --owner,
// и тогда сердечек нет вовсе. Кнопка, которая отвечает 401, хуже её отсутствия.
let me = null;
let starred = new Set();
// Чем открыт лист сейчас — чтобы перерисовать его, когда личность подтвердится.
let reopen = null;
// Избранное, присланное вместе со страницей. Тратится один раз, на первый экран.
let seeded_favs = null;
// Which side of the children's toggle the cached counts were built for. A
// count is a promise about what a click returns, so when the toggle moves the
// counts have to be asked again rather than reused.
let facets_kids = false;

/* --- запомнить выбор: витрина, открытая заново, продолжает разговор --- */
function save(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      kind:[...state.kind], gender:[...state.gender], size:[...state.size],
      brand:[...state.brand], min_price:state.min_price, max_price:state.max_price,
      min_discount:state.min_discount, kids:state.kids, sort:state.sort,
      all_discounts:state.all_discounts,
    }));
  } catch {}
}
function restore(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const s = JSON.parse(raw);
    for (const k of ["kind","gender","size","brand"]) state[k] = new Set(s[k] || []);
    for (const k of ["min_price","max_price","min_discount","sort"])
      if (s[k] != null) state[k] = s[k];
    state.kids = Boolean(s.kids);
    state.all_discounts = Boolean(s.all_discounts);
    return true;
  } catch { return false; }
}

function count_active(){
  return state.kind.size + state.gender.size + state.size.size + state.brand.size
       + (state.min_price ? 1 : 0) + (state.max_price ? 1 : 0)
       + (state.min_discount ? 1 : 0) + (state.kids ? 1 : 0)
       + (state.all_discounts ? 1 : 0);
}

function toggle(name, value){
  state[name].has(value) ? state[name].delete(value) : state[name].add(value);
  reload();
}

function chips(box, name, items, label, mine){
  const all = items || [];
  const show = expanded[name] ? all : all.slice(0, SHOWN);
  const kept = show.concat(all.filter(i => state[name].has(i.value) && !show.includes(i)));
  el(box).innerHTML = "";
  for (const it of kept){
    const b = document.createElement("button");
    b.className = "chip" + (mine?.includes(it.value) ? " hl" : "");
    b.type = "button";
    b.setAttribute("aria-pressed", state[name].has(it.value));
    b.innerHTML = esc(label ? label(it.value) : it.value) + " <small>" + it.count + "</small>";
    b.onclick = () => toggle(name, it.value);
    el(box).append(b);
  }
  const more = el("more-" + name);
  if (more){
    more.hidden = all.length <= SHOWN;
    more.textContent = expanded[name] ? "Свернуть" : `Ещё ${all.length - SHOWN}`;
  }
}

function discount_chips(){
  el("f-disc").innerHTML = "";
  for (const d of DISCOUNTS){
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", String(state.min_discount) === String(d));
    b.textContent = "−" + d + "%";
    b.onclick = () => { state.min_discount = String(state.min_discount) === String(d) ? "" : d; reload(); };
    el("f-disc").append(b);
  }
}

/* Детское скрыто по умолчанию: на полке его 447 из 33 738, и это не то, за чем
   сюда приходят. Но кнопка есть — иначе ошибку классификатора никто не увидит. */
/* Полка показывает только те скидки, за которые ручается кто-то кроме продавца:
   минимум за всё время наблюдения или цена в других магазинах на тот же артикул.
   Из 26 013 карточек, которые она могла бы нарисовать, 20 908 держатся на одной
   лишь зачёркнутой цене магазина — а это единственное число, которое магазин
   пишет о себе сам, и ровно то, что пересказывает любой канал скидок.

   Переключатель, а не запрет: тому, кто ищет конкретную вещь, слабое
   свидетельство тоже нужно — помеченное как слабое. */
function evidence_chip(){
  const box = el("f-evidence");
  box.innerHTML = "";
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.setAttribute("aria-pressed", String(state.all_discounts));
  b.textContent = "Все скидки, включая ценник магазина";
  b.onclick = () => { state.all_discounts = !state.all_discounts; reload(); };
  box.append(b);
}

function kids_chip(){
  const box = el("f-kids");
  box.innerHTML = "";
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.setAttribute("aria-pressed", String(state.kids));
  b.textContent = "Детское";
  b.onclick = () => { state.kids = !state.kids; reload(); };
  box.append(b);
}

/* --- активные фильтры: убрать любой одним нажатием --- */
function draw_active(){
  const box = el("active");
  box.innerHTML = "";
  const add = (text, undo) => {
    const b = document.createElement("button");
    b.className = "tag"; b.type = "button";
    b.innerHTML = `<b>${esc(text)}</b><i>×</i>`;
    b.onclick = () => { undo(); reload(); };
    box.append(b);
  };
  if (state.view === "fav"){
    // В избранном фильтры не применяются, и сказать об этом лучше здесь, чем
    // дать человеку решить, что список сломан.
    add("★ избранное — фильтры не в счёт", () => state.view = "shelf");
    el("fcount").hidden = true;
    return;
  }
  for (const v of state.kind)   add(KIND_RU[v] || v,   () => state.kind.delete(v));
  for (const v of state.gender) add(GENDER_RU[v] || v, () => state.gender.delete(v));
  for (const v of state.size)   add(v,                 () => state.size.delete(v));
  for (const v of state.brand)  add(v,                 () => state.brand.delete(v));
  if (state.kids) add("детское", () => state.kids = false);
  if (state.min_discount) add("от −" + state.min_discount + "%", () => state.min_discount = "");
  if (state.min_price) add("от $" + state.min_price, () => state.min_price = "");
  if (state.max_price) add("до $" + state.max_price, () => state.max_price = "");
  if (count_active() > 1){
    const b = document.createElement("button");
    b.className = "tag reset"; b.type = "button"; b.textContent = "Сбросить всё";
    b.onclick = clear_all;
    box.append(b);
  }
  const n = count_active();
  el("fcount").hidden = !n;
  el("fcount").textContent = n;
}

function clear_all(){
  for (const k of ["kind","gender","size","brand"]) state[k].clear();
  state.min_price = state.max_price = state.min_discount = "";
  state.kids = false;
  el("pmin").value = ""; el("pmax").value = "";
  reload();
}

function params(){
  const p = new URLSearchParams();
  for (const k of ["kind","gender","size","brand"])
    for (const v of state[k]) p.append(k, v);
  if (state.q) p.set("q", state.q);
  for (const k of ["min_price","max_price","min_discount"])
    if (state[k]) p.set(k, state[k]);
  if (state.kids) p.set("kids", "1");
  p.set("sort", state.sort);
  p.set("page", state.page);
  return p;
}

function freshness(iso){
  if (!iso) return {text:"—", stale:false};
  const d = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (d < 1) return {text:"сегодня", stale:false};
  if (d < 2) return {text:"вчера", stale:false};
  return {text:Math.floor(d) + " дн. назад", stale:d >= 4};
}

/* Одна карточка на товар, когда все его размеры стоят одинаково — иначе
   полка трижды подряд показывает те же кроссовки. Но тогда имя одного размера
   на карточке читается как «только этот и остался», поэтому вместо него
   говорится, сколько их. Когда цена по размерам разная, карточки не
   схлопываются вовсе и здесь по-прежнему стоит имя размера: цена на карточке
   обязана быть ценой того размера, который на ней написан. */
function sizes_label(o){
  const n = o.sizes_on_offer || 1;
  if (n < 2) return o.size || "";
  const word = n % 10 === 1 && n % 100 !== 11 ? "размер"
             : [2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100) ? "размера"
             : "размеров";
  return `${n} ${word}`;
}

function card(o){
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const a = document.createElement("a");
  a.className = "card"; a.href = safe(o.url); a.target = "_blank"; a.rel = "noopener";
  // The link is real, so middle-click and "open in new tab" still work; the
  // click is intercepted only to show what everyone else charges first.
  a.onclick = e => { e.preventDefault(); open_sheet(o.id, o.variant); };
  const f = freshness(o.checked_at);
  a.innerHTML = `
    <div class="thumb">
      ${o.image ? `<img loading="lazy" src="${esc(o.image)}" alt="">` : ""}
      <span class="badge">−${o.discount}%</span>
      ${o.all_time_low ? `<span class="low">минимум</span>` : ""}
    </div>
    <div class="body">
      <div class="brand">${esc(o.brand || o.shop)}</div>
      <div class="name">${esc(o.title)}</div>
      <div class="prices"><span class="now">${money(o.price)}</span>
        <span class="then">${money(o.was)}</span>
        <span class="save">−${money(o.saving)}</span></div>
      <div class="meta"><span>${[sizes_label(o), o.shop].filter(Boolean).map(esc).join(" · ")}</span>
        <span class="${f.stale ? "stale" : ""}">${f.text}</span></div>
    </div>`;
  wrap.append(a);
  wrap.append(heart_button(o.id, o.variant));
  wire_hearts(wrap);
  return wrap;
}

/* Избранное — не срез полки, и срезом быть не может: полка это то, что
   подешевело, а вещь, за которой следят, обычно стоит свою обычную цену — за
   этим за ней и следят. Поэтому карточка другая: цена сейчас, движение с того
   дня, когда её отметили, и «нет в наличии» вместо пропажи из списка. */
function fav_card(o){
  const wrap = document.createElement("div");
  wrap.className = "wrap";
  const a = document.createElement("a");
  a.className = "card"; a.href = safe(o.url); a.target = "_blank"; a.rel = "noopener";
  a.onclick = e => { e.preventDefault(); open_sheet(o.id, o.variant); };
  const f = freshness(o.checked_at);
  const move = (o.price != null && o.since) ? o.price - o.since : null;
  const moved = move !== null && Math.abs(move) >= 0.01;
  a.innerHTML = `
    <div class="thumb">
      ${o.image ? `<img loading="lazy" src="${esc(o.image)}" alt="">` : ""}
      ${o.discount ? `<span class="badge">−${o.discount}%</span>` : ""}
    </div>
    <div class="body">
      <div class="brand">${esc(o.brand || o.shop)}</div>
      <div class="name">${esc(o.title)}</div>
      <div class="prices">${o.price == null
        ? `<span class="now gone">нет в наличии</span>`
        : `<span class="now">${money(o.price)}</span>`}
        ${moved && move < 0 ? `<span class="then">${money(o.since)}</span>` : ""}</div>
      <div class="fav-line">${
        moved
          ? (move < 0 ? `<b>дешевле на ${money(-move)}</b>` : `дороже на ${money(move)}`)
          : (o.since ? "цена та же" : "цена ещё не записана")}</div>
      <div class="meta"><span>${esc(o.shop)}</span>
        <span class="${f.stale ? "stale" : ""}">${f.text}</span></div>
    </div>`;
  wrap.append(a);
  wrap.append(heart_button(o.id, o.variant));
  wire_hearts(wrap);
  return wrap;
}

async function load_favorites(){
  // Список, пришедший вместе со страницей, рисуется без запроса — ссылка
  // ?favorites=1 открывается сразу на нём, как и всё остальное здесь.
  let items = seeded_favs;
  seeded_favs = null;
  if (!items){
    let r;
    try { r = await fetch("/api/favorites", {headers: tg_headers()}); } catch { return; }
    if (!r.ok){ state.view = "shelf"; reload(); return; }
    items = (await r.json()).items;
  }
  const d = {items};
  starred = new Set(d.items.map(i => i.id));
  draw_fav_count();
  el("count").textContent = plural(d.items.length, "вещь", "вещи", "вещей");
  el("more").hidden = true;
  el("grid").innerHTML = d.items.length ? "" : `<div class="empty">Здесь пусто.<br>
    Нажмите ♡ на любой карточке — и об этой вещи придёт уведомление, даже если
    она подешевеет всего на пару процентов.</div>`;
  for (const o of d.items) el("grid").append(fav_card(o));
}

function render(data, append){
  el("count").textContent = data.total.toLocaleString("ru") + " шт.";
  if (!append) el("grid").innerHTML = "";
  if (!data.offers.length && !append){
    el("grid").innerHTML = `<div class="empty">Под эти условия ничего нет.<br>
      ${state.q
        ? "На полке лежит только то, что подешевело — попробуйте кнопку над списком."
        : count_active() ? "Снимите часть фильтров — они над списком." : "Полка пуста."}</div>`;
  }
  for (const o of data.offers) el("grid").append(card(o));
  el("more").hidden = state.page + 1 >= data.pages;
}

async function load(append){
  if (!append) el("grid").innerHTML = `<div class="skeleton">Ищу…</div>`;
  const data = await api("/api/offers?" + params());
  if (data === LOCKED) return show_paywall();
  render(data, append);
}

function draw_mine(){
  const mine = facets?.mine?.sizes || [];
  const button = el("mine-size");
  button.hidden = mine.length === 0;
  button.classList.toggle("on", mine.length > 0 && mine.every(v => state.size.has(v)));
  button.textContent = `только мои: ${mine.join(", ")}`;
}

function reload(){
  state.page = 0;
  draw_active();
  el("fav").setAttribute("aria-pressed", String(state.view === "fav"));
  if (state.view === "fav"){
    el("whole").hidden = true;
    load_favorites();
    return;
  }
  if (facets && facets_kids !== state.kids){
    save();
    api("/api/facets" + (state.kids ? "?kids=1" : ""))
      .then(f => { if (f === LOCKED) return show_paywall();
                   facets = f; facets_kids = state.kids; reload(); });
    return;
  }
  if (facets){
    draw_mine();
    chips("f-size", "size", facets.sizes, null, facets.mine?.sizes);
    chips("f-brand", "brand", facets.brands);
    chips("f-kind", "kind", facets.kinds, v => KIND_RU[v] || v, facets.mine?.kinds);
    chips("f-gender", "gender", facets.genders, v => GENDER_RU[v] || v, facets.mine?.genders);
    discount_chips();
    kids_chip();
    evidence_chip();
  }
  draw_whole();
  save();
  load(false);
}

/* --- карточка товара --- */
function shop_row(o, mine, cheap){
  const cls = o === mine ? "us" : (cheap && o.price === cheap.price ? "cheap" : "");
  const where = esc(o.shop) + (o.country ? " · " + esc(o.country) : "");
  return `<tr class="${cls}"><td>${o === mine ? "здесь — " : ""}${where}</td>
          <td class="p">${money(o.price)}</td></tr>`;
}

// Цена в валюте магазина: так её и назначали, а доллары рисуют ступеньки,
// которые сделал курс, а не магазин.
const native = (n, cur) => {
  try {
    return new Intl.NumberFormat("ru-RU", {style: "currency", currency: cur,
      maximumFractionDigits: n < 100 ? 2 : 0}).format(n);
  } catch { return `${Math.round(n)} ${cur}`; }
};
const day = t => new Date(t).toLocaleDateString("ru-RU", {day: "numeric", month: "short"});

function price_chart(h){
  const pts = (h && h.points) || [];
  if (!pts.length) return "";
  const cur = h.currency;
  if (pts.length === 1)
    return `<div class="hist"><div class="hist-head">Цена не менялась с ${day(pts[0].t)}
            — ${native(pts[0].p, cur)}</div></div>`;
  const W = 320, H = 88, pad = 8;
  const ts = pts.map(x => Date.parse(x.t)), ps = pts.map(x => x.p);
  const t0 = ts[0], t1 = Math.max(Date.now(), ts[ts.length - 1]);
  const lo = Math.min(...ps), hi = Math.max(...ps);
  const X = t => (pad + (W - 2 * pad) * (t - t0) / Math.max(1, t1 - t0)).toFixed(1);
  const Y = p => (hi === lo ? H / 2 : pad + (H - 2 * pad) * (hi - p) / (hi - lo)).toFixed(1);
  let d = `M${X(ts[0])},${Y(ps[0])}`;
  for (let i = 1; i < pts.length; i++) d += ` H${X(ts[i])} V${Y(ps[i])}`;
  d += ` H${X(t1)}`;
  const gone = pts.filter(x => !x.in_stock).map(x =>
    `<circle cx="${X(Date.parse(x.t))}" cy="${Y(x.p)}" r="3" fill="var(--faint)"/>`).join("");
  return `<div class="hist">
    <div class="hist-head">История цены · ${esc(cur)} · ${plural(pts.length, "изменение", "изменения", "изменений")}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Цена от ${native(lo, cur)} до ${native(hi, cur)}">
      <path d="${d}" fill="none" stroke="currentColor" stroke-width="2"
            vector-effect="non-scaling-stroke"/>${gone}
    </svg>
    <div class="hist-foot"><span>${day(t0)}</span>
      <span>мин ${native(lo, cur)} · макс ${native(hi, cur)}</span><span>сейчас</span></div>
  </div>`;
}

async function open_sheet(id, variant){
  reopen = () => open_sheet(id, variant);
  const d = el("sheet");
  el("sheet-body").innerHTML = "<p style='color:var(--dim)'>Смотрю, у кого ещё это есть…</p>";
  if (!d.open) d.showModal();
  let got;
  try { got = await api("/api/product/" + id + (variant ? "?variant=" + variant : "")); }
  catch { el("sheet-body").innerHTML = "<p>Это предложение уже сняли с полки.</p>"; return; }
  if (got === LOCKED){ d.close(); return show_paywall(); }
  const {ours, sizes, elsewhere, cheapest_elsewhere: cheap} = got;

  let verdict;
  if (!elsewhere.length)
    verdict = `<div class="verdict alone">Этот артикул больше нигде не найден —
               сравнить не с чем. Скидка посчитана от ${ours.source === "tag"
               ? "перечёркнутой цены магазина" : "прежней цены"}.</div>`;
  else if (cheap)
    verdict = `<div class="verdict beaten">Дешевле в ${esc(cheap.shop)}:
               <b>${money(cheap.price)}</b> — на ${money(ours.price - cheap.price)} меньше.</div>`;
  else if (elsewhere[0].price <= ours.price)
    // Nobody is cheaper, but somebody matches. "Cheapest here" would be a shade
    // stronger than the truth, and the page is only worth anything if it never is.
    verdict = `<div class="verdict best">Столько же в ${esc(elsewhere[0].shop)}.
               Дешевле нет нигде — всего ${elsewhere.length} магазин(ов) с этим артикулом.</div>`;
  else
    verdict = `<div class="verdict best">Дешевле всего здесь: следующая цена —
               ${money(elsewhere[0].price)} в ${esc(elsewhere[0].shop)}, это на
               ${money(elsewhere[0].price - ours.price)} больше.</div>`;

  const all = [...elsewhere, ours].sort((a, b) => a.price - b.price);
  const have = sizes.filter(s => s.in_stock), gone = sizes.filter(s => !s.in_stock);

  el("sheet-body").innerHTML = `
    <div class="hero">
      ${ours.image ? `<img src="${esc(ours.image)}" alt="">` : ""}
      <div>
        <div class="brand">${esc(ours.brand || "")}</div>
        <h2>${esc(ours.title)}</h2>
        <div class="prices"><span class="big">${money(ours.price)}</span>
          <span class="then">${money(ours.was)}</span>
          <span class="badge" style="position:static">−${ours.discount}%</span></div>
        ${me === null ? "" : `<div style="margin-top:9px">${heart_inline(ours.id, ours.variant)}</div>`}
      </div>
    </div>
    ${verdict}
    ${price_chart(got.history)}
    ${have.length || gone.length ? `<div class="sizes">
      ${have.map(s => `<span class="sz">${esc(s.size)}</span>`).join("")}
      ${gone.map(s => `<span class="sz out">${esc(s.size)}</span>`).join("")}
    </div>` : ""}
    ${elsewhere.length ? `<table>${all.map(o => shop_row(o, ours, cheap)).join("")}</table>` : ""}
    <a class="go" href="${esc(safe(ours.url))}" target="_blank" rel="noopener">Открыть в ${esc(ours.shop)}</a>`;
  wire_hearts(el("sheet-body"));
}

/* --- «пробить по всем магазинам»: полка против каталога --- */
function draw_whole(){
  const box = el("whole");
  box.innerHTML = "";
  box.hidden = !state.q;
  if (!state.q) return;
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = `Пробить «${state.q}» по всем магазинам — включая то, что без скидки`;
  b.onclick = () => open_lookup(state.q);
  box.append(b);
}

async function open_lookup(query){
  reopen = () => open_lookup(query);
  const d = el("sheet");
  el("sheet-body").innerHTML = "<p style='color:var(--dim)'>Смотрю по всем магазинам…</p>";
  if (!d.open) d.showModal();
  const f = await api("/api/lookup?q=" + encodeURIComponent(query));
  if (f === LOCKED){ d.close(); return show_paywall(); }

  if (!f.shops.length){
    el("sheet-body").innerHTML = `<h2>«${esc(query)}»</h2>
      <p style="color:var(--dim)">${f.too_common
        ? `«${esc(f.too_common)}» стоит в поле артикула у слишком многих разных
           товаров — это слово, а не номер модели.`
        : "Ничего не нашлось. Попробуйте артикул с коробки, например CW2288-111."}</p>`;
    return;
  }

  // Артикул и название — разные вопросы, и рисовать их одинаково нельзя:
  // «дешевле всего» про 242 непохожие вещи было бы неправдой.
  const head = f.same_thing
    ? `<h2>${esc(f.key)}</h2><div class="verdict ${f.found === 1 ? "alone" : "best"}">
       ${f.found === 1
         ? "Только один магазин — сравнить не с чем."
         : `Дешевле всего <b>${money(f.shops[0].price)}</b> в ${esc(f.shops[0].shop)} —
            этот артикул держат ${plural(f.found, "магазин", "магазина", "магазинов")}.`}</div>`
    : `<h2>«${esc(query)}»</h2><div class="verdict alone">По названию нашлось
       ${plural(f.found, "товар", "товара", "товаров")} — это разные вещи,
       а не одна в разных магазинах.</div>`;

  const rows = f.shops.map(o => `<tr>
      <td>${esc(o.shop)}${o.country ? " · " + esc(o.country) : ""}</td>
      <td>${f.same_thing ? "" : esc(String(o.title).slice(0, 46))}</td>
      <td style="text-align:right">${money(o.price)}${
        o.discount_pct ? ` <span class="badge" style="position:static">−${Math.round(o.discount_pct)}%</span>` : ""}</td>
      <td><a href="${esc(safe(o.url))}" target="_blank" rel="noopener">открыть</a></td>
      ${me === null ? "" : `<td>${heart_inline(o.product_id, null)}</td>`}
    </tr>`).join("");

  el("sheet-body").innerHTML = head + `<table>${rows}</table>`;
  wire_hearts(el("sheet-body"));
}

/* --- обработчики --- */
el("x").onclick = () => el("sheet").close();
el("sheet").onclick = e => { if (e.target === el("sheet")) el("sheet").close(); };
el("more").onclick = () => { state.page++; load(true); };
el("sort").onchange = e => { state.sort = e.target.value; reload(); };
if (new URLSearchParams(location.search).has("filters")){
  el("panel").classList.add("open");
  el("toggle").setAttribute("aria-expanded", "true");
}
el("fav").onclick = () => {
  state.view = state.view === "fav" ? "shelf" : "fav";
  reload();
};
el("toggle").onclick = () => {
  const open = el("panel").classList.toggle("open");
  el("toggle").setAttribute("aria-expanded", open);
};
// The shelf opens on everything on purpose — a size you do not take is still
// worth seeing, and narrowing by default hides most of the catalogue before
// anybody has asked. This is the one click that narrows to your own sizes,
// and clicking it again gives them all back.
el("mine-size").onclick = () => {
  const mine = facets?.mine?.sizes || [];
  const already = mine.length && mine.every(v => state.size.has(v));
  state.size = already ? new Set() : new Set(mine);
  reload();
};
el("more-size").onclick = () => { expanded.size = !expanded.size; reload(); };
el("more-brand").onclick = () => { expanded.brand = !expanded.brand; reload(); };

let typing;
el("q").oninput = e => {
  el("q-clear").hidden = !e.target.value;
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = e.target.value.trim(); reload(); }, 280);
};
el("q-clear").onclick = () => {
  el("q").value = ""; el("q-clear").hidden = true; state.q = ""; reload();
};
for (const [id, key] of [["pmin","min_price"], ["pmax","max_price"]]){
  el(id).onchange = e => { state[key] = e.target.value.trim(); reload(); };
}

(function start(){
  // ?product=N opens straight onto one thing, so a find can be sent to somebody
  // as a link rather than as a description of where to look.
  const wanted = new URLSearchParams(location.search).get("product");
  if (wanted) open_sheet(wanted);
  // ?lookup=CW2288-111 открывается сразу на ответе «где это дешевле всего»,
  // чтобы находку можно было переслать, как и карточку товара.
  const asked = new URLSearchParams(location.search).get("lookup");
  if (asked) open_lookup(asked.trim());

  const seed = JSON.parse(el("seed").textContent).seed;
  // Раньше всего, что рисует карточки: сердечко на них ставится по тому, знаем
  // ли мы, кто смотрит.
  if (seed && seed.me != null) announce(seed.me, seed.favorites);
  if (seed && seed.favorites_items){
    seeded_favs = seed.favorites_items;
    state.view = "fav";
  }
  const remembered = restore();
  // The server renders the first screenful from the query string, so the page
  // has to read it too — otherwise /?kids=1 paints the children's shelf and the
  // first fetch replaces it with the grown-up one.
  const url_params = new URLSearchParams(location.search);
  if (url_params.get("kids") === "1") state.kids = true;
  if (url_params.get("q")) state.q = url_params.get("q").trim();
  el("sort").value = state.sort;
  el("q").value = state.q;
  el("q-clear").hidden = !state.q;
  el("pmin").value = state.min_price;
  el("pmax").value = state.max_price;

  const ready = f => {
    facets = f;
    facets_kids = state.kids;
    if (f.price && f.price.max)
      el("prange").textContent = `на полке ${money(f.price.min)} – ${money(f.price.max)}`;
    reload();
  };
  if (seed && !remembered){
    // Nothing chosen yet: the seed in the HTML is already the right answer.
    facets = seed.facets;
    facets_kids = state.kids;
    if (facets.price?.max)
      el("prange").textContent = `на полке ${money(facets.price.min)} – ${money(facets.price.max)}`;
    draw_active();
    draw_mine();
    chips("f-size", "size", facets.sizes, null, facets.mine?.sizes);
    chips("f-brand", "brand", facets.brands);
    chips("f-kind", "kind", facets.kinds, v => KIND_RU[v] || v, facets.mine?.kinds);
    chips("f-gender", "gender", facets.genders, v => GENDER_RU[v] || v, facets.mine?.genders);
    discount_chips();
    kids_chip();
    evidence_chip();
    draw_whole();
    render(seed.offers, false);
    if (state.view === "fav") reload();
  } else if (seed){
    ready(seed.facets);
  } else {
    api("/api/facets" + (state.kids ? "?kids=1" : ""))
      .then(f => f === LOCKED ? show_paywall() : ready(f));
  }
})();
</script>
