<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скидки</title>
<!-- Deferred on purpose: it is only needed to sit nicely inside Telegram, and
     as a blocking script it holds up the whole shelf whenever telegram.org is
     slow — which, on a phone on a bad connection, is often. Everything below
     treats it as optional. -->
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1917; --dim:#78716c; --faint:#a8a29e;
  --line:#e7e5e4; --chip:#f5f5f4; --accent:#15803d; --hot:#be123c;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c0a09; --card:#1c1917; --ink:#fafaf9; --dim:#a8a29e; --faint:#78716c;
         --line:#2c2725; --chip:#262220; --accent:#4ade80; --hot:#fb7185;
         --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}

/* --- шапка --- */
header{position:sticky;top:0;z-index:20;background:var(--bg);
       border-bottom:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;max-width:1400px;margin:0 auto}
.field{flex:1 1 auto;position:relative;min-width:0}
.field input{width:100%;background:var(--card);border:1px solid var(--line);
             border-radius:10px;padding:9px 32px 9px 12px}
.field button{position:absolute;right:4px;top:50%;transform:translateY(-50%);
              border:none;background:none;color:var(--faint);font-size:18px;
              padding:2px 6px;cursor:pointer}
.tool{flex:0 0 auto;background:var(--card);border:1px solid var(--line);
      border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.tool[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool .n{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;
         border-radius:9px;background:var(--hot);color:#fff;font-size:12px;text-align:center}
/* display on the class would otherwise beat the hidden attribute, and the
   badge would sit there reading "0". */
[hidden]{display:none !important}
select.tool{padding-right:8px}
.count{color:var(--dim);font-size:13px;white-space:nowrap;padding-right:2px}

/* --- активные фильтры одной строкой --- */
.active{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;max-width:1400px;margin:0 auto}
.active:empty{display:none}
.tag{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--ink);
     color:var(--bg);border:none;border-radius:999px;padding:4px 8px 4px 11px;
     font-size:12.5px;cursor:pointer;white-space:nowrap}
.tag b{font-weight:600}
.tag i{font-style:normal;opacity:.6;font-size:14px;line-height:1}
.tag.reset{background:none;color:var(--hot);border:1px solid var(--hot);padding:4px 11px}

/* --- панель фильтров --- */
.panel{display:none;border-top:1px solid var(--line);background:var(--card)}
.panel.open{display:block}
.panel .inner{max-width:1400px;margin:0 auto;padding:12px 12px 14px;
              max-height:min(62vh,560px);overflow-y:auto}
.group{margin-bottom:14px}
.group:last-child{margin-bottom:0}
.group h3{margin:0 0 7px;font-size:11.5px;font-weight:600;letter-spacing:.06em;
          text-transform:uppercase;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;
      padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.5;margin-left:4px;font-size:11.5px}
.chip.hl{border-color:var(--accent);color:var(--accent);background:transparent}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input{width:96px;background:var(--bg);border:1px solid var(--line);
             border-radius:9px;padding:7px 10px}
.range span{color:var(--faint);font-size:13px}
.mine-link{border:1px solid var(--line);background:none;color:var(--dim);
  font-size:11.5px;font-weight:500;margin-left:8px;padding:2px 8px;border-radius:99px;
  cursor:pointer;vertical-align:middle}
.mine-link:hover{color:var(--ink);border-color:var(--ink)}
.mine-link.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.more-link{border:none;background:none;color:var(--dim);font-size:12.5px;
           cursor:pointer;padding:5px 2px;text-decoration:underline}

/* --- сетка --- */
main{display:grid;gap:11px;padding:13px 12px 8px;max-width:1400px;margin:0 auto;
     grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
      overflow:hidden;display:flex;flex-direction:column;text-decoration:none;
      color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.thumb{aspect-ratio:1;background:var(--chip);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:7px;left:7px;background:var(--hot);color:#fff;
       border-radius:7px;padding:2px 7px;font-size:12px;font-weight:700}
.low{position:absolute;top:7px;right:7px;background:var(--accent);color:#fff;
     border-radius:7px;padding:2px 7px;font-size:11px;font-weight:700}
.body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.brand{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.name{font-size:13px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden}
.prices{display:flex;gap:6px;align-items:baseline;margin-top:auto;padding-top:6px}
.now{font-weight:700}
.then{color:var(--faint);text-decoration:line-through;font-size:12px}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--dim)}
.stale{color:var(--hot)}
#more{display:block;margin:14px auto 44px;padding:11px 28px;background:var(--card);
      border:1px solid var(--line);border-radius:11px;cursor:pointer}
.empty{padding:56px 16px;text-align:center;color:var(--dim);grid-column:1/-1;line-height:1.7}
.skeleton{grid-column:1/-1;padding:40px;text-align:center;color:var(--faint)}

/* --- карточка товара --- */
dialog{border:none;border-radius:16px;padding:0;max-width:560px;
       width:calc(100% - 20px);background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{padding:18px 18px 18px;position:relative}
.sheet h2{margin:0 0 3px;font-size:17px;line-height:1.3}
.hero{display:flex;gap:13px;margin-bottom:13px}
.hero img{width:106px;height:106px;object-fit:cover;border-radius:10px;
          background:var(--chip);flex:0 0 auto}
.big{font-size:23px;font-weight:700}
.verdict{margin:11px 0 13px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.45}
.verdict.best{background:color-mix(in srgb,var(--accent) 13%,transparent)}
.verdict.beaten{background:color-mix(in srgb,var(--hot) 13%,transparent)}
.verdict.alone{background:var(--chip);color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:7px 2px;border-top:1px solid var(--line);vertical-align:baseline}
td.p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.us td{font-weight:700}
tr.cheap td.p{color:var(--accent);font-weight:600}
.sizes{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 4px}
.sz{border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:12px}
.sz.out{opacity:.32;text-decoration:line-through}
.go{display:block;text-align:center;margin-top:15px;padding:12px;border-radius:11px;
    background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.close{position:absolute;top:10px;right:12px;border:none;background:none;
       color:var(--faint);font-size:26px;line-height:1;cursor:pointer}
</style>

<header>
  <div class="bar">
    <span class="field">
      <input type="search" id="q" placeholder="Поиск: nike, cargo, carhartt…" autocomplete="off">
      <button id="q-clear" hidden aria-label="Очистить">×</button>
    </span>
    <button class="tool" id="toggle" aria-expanded="false">Фильтры<span class="n" id="fcount" hidden></span></button>
    <select class="tool" id="sort" aria-label="Сортировка">
      <option value="score">Лучшие</option>
      <option value="discount">Больше скидка</option>
      <option value="saving">Больше экономия</option>
      <option value="cheapest">Дешевле</option>
      <option value="newest">Новее</option>
      <option value="freshest">Свежее проверено</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="active" id="active"></div>
  <div class="panel" id="panel"><div class="inner">
    <div class="group">
      <h3>Цена, $</h3>
      <div class="range">
        <input type="number" id="pmin" min="0" placeholder="от" inputmode="numeric">
        <span>—</span>
        <input type="number" id="pmax" min="0" placeholder="до" inputmode="numeric">
        <span id="prange"></span>
      </div>
    </div>
    <div class="group"><h3>Скидка не меньше</h3><div class="chips" id="f-disc"></div></div>
    <div class="group"><h3>Что</h3><div class="chips" id="f-kind"></div></div>
    <div class="group"><h3>Кому</h3><div class="chips" id="f-gender"></div>
      <div class="chips" id="f-kids"></div></div>
    <div class="group"><h3>Размер<button class="mine-link" id="mine-size" hidden>только мои</button></h3>
      <div class="chips" id="f-size"></div>
      <button class="more-link" id="more-size" hidden>Все размеры</button></div>
    <div class="group"><h3>Марка</h3><div class="chips" id="f-brand"></div>
      <button class="more-link" id="more-brand" hidden>Все марки</button></div>
  </div></div>
</header>

<script type="application/json" id="seed">{"seed": null}</script>
<main id="grid"><div class="skeleton">Открываю полку…</div></main>
<button id="more" hidden>Показать ещё</button>
<dialog id="sheet"><button class="close" id="x" aria-label="Закрыть">×</button>
  <div class="sheet" id="sheet-body"></div></dialog>

<script>
addEventListener("load", () => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
});

const KIND_RU = {shoes:"Обувь", clothing:"Одежда", accessories:"Аксессуары"};
const GENDER_RU = {men:"Мужское", women:"Женское"};
const DISCOUNTS = [30, 40, 50, 60, 70];
const SHOWN = 18;            // сколько чипов показывать до «все»
const STORE = "shelf.filters";

const el = id => document.getElementById(id);
const money = n => "$" + (n < 100 ? n.toFixed(2) : Math.round(n));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const state = {kind:new Set(), gender:new Set(), size:new Set(), brand:new Set(),
               q:"", min_price:"", max_price:"", min_discount:"", kids:false,
               sort:"score", page:0};
let facets = null, expanded = {size:false, brand:false};
// Which side of the children's toggle the cached counts were built for. A
// count is a promise about what a click returns, so when the toggle moves the
// counts have to be asked again rather than reused.
let facets_kids = false;

/* --- запомнить выбор: витрина, открытая заново, продолжает разговор --- */
function save(){
  try {
    localStorage.setItem(STORE, JSON.stringify({
      kind:[...state.kind], gender:[...state.gender], size:[...state.size],
      brand:[...state.brand], min_price:state.min_price, max_price:state.max_price,
      min_discount:state.min_discount, kids:state.kids, sort:state.sort,
    }));
  } catch {}
}
function restore(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const s = JSON.parse(raw);
    for (const k of ["kind","gender","size","brand"]) state[k] = new Set(s[k] || []);
    for (const k of ["min_price","max_price","min_discount","sort"])
      if (s[k] != null) state[k] = s[k];
    state.kids = Boolean(s.kids);
    return true;
  } catch { return false; }
}

function count_active(){
  return state.kind.size + state.gender.size + state.size.size + state.brand.size
       + (state.min_price ? 1 : 0) + (state.max_price ? 1 : 0)
       + (state.min_discount ? 1 : 0) + (state.kids ? 1 : 0);
}

function toggle(name, value){
  state[name].has(value) ? state[name].delete(value) : state[name].add(value);
  reload();
}

function chips(box, name, items, label, mine){
  const all = items || [];
  const show = expanded[name] ? all : all.slice(0, SHOWN);
  const kept = show.concat(all.filter(i => state[name].has(i.value) && !show.includes(i)));
  el(box).innerHTML = "";
  for (const it of kept){
    const b = document.createElement("button");
    b.className = "chip" + (mine?.includes(it.value) ? " hl" : "");
    b.type = "button";
    b.setAttribute("aria-pressed", state[name].has(it.value));
    b.innerHTML = esc(label ? label(it.value) : it.value) + " <small>" + it.count + "</small>";
    b.onclick = () => toggle(name, it.value);
    el(box).append(b);
  }
  const more = el("more-" + name);
  if (more){
    more.hidden = all.length <= SHOWN;
    more.textContent = expanded[name] ? "Свернуть" : `Ещё ${all.length - SHOWN}`;
  }
}

function discount_chips(){
  el("f-disc").innerHTML = "";
  for (const d of DISCOUNTS){
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", String(state.min_discount) === String(d));
    b.textContent = "−" + d + "%";
    b.onclick = () => { state.min_discount = String(state.min_discount) === String(d) ? "" : d; reload(); };
    el("f-disc").append(b);
  }
}

/* Детское скрыто по умолчанию: на полке его 447 из 33 738, и это не то, за чем
   сюда приходят. Но кнопка есть — иначе ошибку классификатора никто не увидит. */
function kids_chip(){
  const box = el("f-kids");
  box.innerHTML = "";
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button";
  b.setAttribute("aria-pressed", String(state.kids));
  b.textContent = "Детское";
  b.onclick = () => { state.kids = !state.kids; reload(); };
  box.append(b);
}

/* --- активные фильтры: убрать любой одним нажатием --- */
function draw_active(){
  const box = el("active");
  box.innerHTML = "";
  const add = (text, undo) => {
    const b = document.createElement("button");
    b.className = "tag"; b.type = "button";
    b.innerHTML = `<b>${esc(text)}</b><i>×</i>`;
    b.onclick = () => { undo(); reload(); };
    box.append(b);
  };
  for (const v of state.kind)   add(KIND_RU[v] || v,   () => state.kind.delete(v));
  for (const v of state.gender) add(GENDER_RU[v] || v, () => state.gender.delete(v));
  for (const v of state.size)   add(v,                 () => state.size.delete(v));
  for (const v of state.brand)  add(v,                 () => state.brand.delete(v));
  if (state.kids) add("детское", () => state.kids = false);
  if (state.min_discount) add("от −" + state.min_discount + "%", () => state.min_discount = "");
  if (state.min_price) add("от $" + state.min_price, () => state.min_price = "");
  if (state.max_price) add("до $" + state.max_price, () => state.max_price = "");
  if (count_active() > 1){
    const b = document.createElement("button");
    b.className = "tag reset"; b.type = "button"; b.textContent = "Сбросить всё";
    b.onclick = clear_all;
    box.append(b);
  }
  const n = count_active();
  el("fcount").hidden = !n;
  el("fcount").textContent = n;
}

function clear_all(){
  for (const k of ["kind","gender","size","brand"]) state[k].clear();
  state.min_price = state.max_price = state.min_discount = "";
  state.kids = false;
  el("pmin").value = ""; el("pmax").value = "";
  reload();
}

function params(){
  const p = new URLSearchParams();
  for (const k of ["kind","gender","size","brand"])
    for (const v of state[k]) p.append(k, v);
  if (state.q) p.set("q", state.q);
  for (const k of ["min_price","max_price","min_discount"])
    if (state[k]) p.set(k, state[k]);
  if (state.kids) p.set("kids", "1");
  p.set("sort", state.sort);
  p.set("page", state.page);
  return p;
}

function freshness(iso){
  const d = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (d < 1) return {text:"сегодня", stale:false};
  if (d < 2) return {text:"вчера", stale:false};
  return {text:Math.floor(d) + " дн. назад", stale:d >= 4};
}

function card(o){
  const a = document.createElement("a");
  a.className = "card"; a.href = o.url; a.target = "_blank"; a.rel = "noopener";
  // The link is real, so middle-click and "open in new tab" still work; the
  // click is intercepted only to show what everyone else charges first.
  a.onclick = e => { e.preventDefault(); open_sheet(o.id, o.variant); };
  const f = freshness(o.checked_at);
  a.innerHTML = `
    <div class="thumb">
      ${o.image ? `<img loading="lazy" src="${esc(o.image)}" alt="">` : ""}
      <span class="badge">−${o.discount}%</span>
      ${o.all_time_low ? `<span class="low">минимум</span>` : ""}
    </div>
    <div class="body">
      <div class="brand">${esc(o.brand || o.shop)}</div>
      <div class="name">${esc(o.title)}</div>
      <div class="prices"><span class="now">${money(o.price)}</span>
        <span class="then">${money(o.was)}</span></div>
      <div class="meta"><span>${esc(o.size || "—")}</span><span>${esc(o.shop)}</span></div>
      <div class="meta"><span class="${f.stale ? "stale" : ""}">${f.text}</span>
        <span>−${money(o.saving)}</span></div>
    </div>`;
  return a;
}

function render(data, append){
  el("count").textContent = data.total.toLocaleString("ru") + " шт.";
  if (!append) el("grid").innerHTML = "";
  if (!data.offers.length && !append){
    el("grid").innerHTML = `<div class="empty">Под эти условия ничего нет.<br>
      ${count_active() ? "Снимите часть фильтров — они над списком." : "Полка пуста."}</div>`;
  }
  for (const o of data.offers) el("grid").append(card(o));
  el("more").hidden = state.page + 1 >= data.pages;
}

async function load(append){
  if (!append) el("grid").innerHTML = `<div class="skeleton">Ищу…</div>`;
  render(await (await fetch("/api/offers?" + params())).json(), append);
}

function draw_mine(){
  const mine = facets?.mine?.sizes || [];
  const button = el("mine-size");
  button.hidden = mine.length === 0;
  button.classList.toggle("on", mine.length > 0 && mine.every(v => state.size.has(v)));
  button.textContent = `только мои: ${mine.join(", ")}`;
}

function reload(){
  state.page = 0;
  draw_active();
  if (facets && facets_kids !== state.kids){
    save();
    fetch("/api/facets" + (state.kids ? "?kids=1" : ""))
      .then(r => r.json())
      .then(f => { facets = f; facets_kids = state.kids; reload(); });
    return;
  }
  if (facets){
    draw_mine();
    chips("f-size", "size", facets.sizes, null, facets.mine?.sizes);
    chips("f-brand", "brand", facets.brands);
    chips("f-kind", "kind", facets.kinds, v => KIND_RU[v] || v, facets.mine?.kinds);
    chips("f-gender", "gender", facets.genders, v => GENDER_RU[v] || v, facets.mine?.genders);
    discount_chips();
    kids_chip();
  }
  save();
  load(false);
}

/* --- карточка товара --- */
function shop_row(o, mine, cheap){
  const cls = o === mine ? "us" : (cheap && o.price === cheap.price ? "cheap" : "");
  const where = esc(o.shop) + (o.country ? " · " + esc(o.country) : "");
  return `<tr class="${cls}"><td>${o === mine ? "здесь — " : ""}${where}</td>
          <td class="p">${money(o.price)}</td></tr>`;
}

async function open_sheet(id, variant){
  const d = el("sheet");
  el("sheet-body").innerHTML = "<p style='color:var(--dim)'>Смотрю, у кого ещё это есть…</p>";
  if (!d.open) d.showModal();
  const r = await fetch("/api/product/" + id + (variant ? "?variant=" + variant : ""));
  if (!r.ok){ el("sheet-body").innerHTML = "<p>Это предложение уже сняли с полки.</p>"; return; }
  const {ours, sizes, elsewhere, cheapest_elsewhere: cheap} = await r.json();

  let verdict;
  if (!elsewhere.length)
    verdict = `<div class="verdict alone">Этот артикул больше нигде не найден —
               сравнить не с чем. Скидка посчитана от ${ours.source === "tag"
               ? "перечёркнутой цены магазина" : "прежней цены"}.</div>`;
  else if (cheap)
    verdict = `<div class="verdict beaten">Дешевле в ${esc(cheap.shop)}:
               <b>${money(cheap.price)}</b> — на ${money(ours.price - cheap.price)} меньше.</div>`;
  else if (elsewhere[0].price <= ours.price)
    // Nobody is cheaper, but somebody matches. "Cheapest here" would be a shade
    // stronger than the truth, and the page is only worth anything if it never is.
    verdict = `<div class="verdict best">Столько же в ${esc(elsewhere[0].shop)}.
               Дешевле нет нигде — всего ${elsewhere.length} магазин(ов) с этим артикулом.</div>`;
  else
    verdict = `<div class="verdict best">Дешевле всего здесь: следующая цена —
               ${money(elsewhere[0].price)} в ${esc(elsewhere[0].shop)}, это на
               ${money(elsewhere[0].price - ours.price)} больше.</div>`;

  const all = [...elsewhere, ours].sort((a, b) => a.price - b.price);
  const have = sizes.filter(s => s.in_stock), gone = sizes.filter(s => !s.in_stock);

  el("sheet-body").innerHTML = `
    <div class="hero">
      ${ours.image ? `<img src="${esc(ours.image)}" alt="">` : ""}
      <div>
        <div class="brand">${esc(ours.brand || "")}</div>
        <h2>${esc(ours.title)}</h2>
        <div class="prices"><span class="big">${money(ours.price)}</span>
          <span class="then">${money(ours.was)}</span>
          <span class="badge" style="position:static">−${ours.discount}%</span></div>
      </div>
    </div>
    ${verdict}
    ${have.length || gone.length ? `<div class="sizes">
      ${have.map(s => `<span class="sz">${esc(s.size)}</span>`).join("")}
      ${gone.map(s => `<span class="sz out">${esc(s.size)}</span>`).join("")}
    </div>` : ""}
    ${elsewhere.length ? `<table>${all.map(o => shop_row(o, ours, cheap)).join("")}</table>` : ""}
    <a class="go" href="${esc(ours.url)}" target="_blank" rel="noopener">Открыть в ${esc(ours.shop)}</a>`;
}

/* --- обработчики --- */
el("x").onclick = () => el("sheet").close();
el("sheet").onclick = e => { if (e.target === el("sheet")) el("sheet").close(); };
el("more").onclick = () => { state.page++; load(true); };
el("sort").onchange = e => { state.sort = e.target.value; reload(); };
if (new URLSearchParams(location.search).has("filters")){
  el("panel").classList.add("open");
  el("toggle").setAttribute("aria-expanded", "true");
}
el("toggle").onclick = () => {
  const open = el("panel").classList.toggle("open");
  el("toggle").setAttribute("aria-expanded", open);
};
// The shelf opens on everything on purpose — a size you do not take is still
// worth seeing, and narrowing by default hides most of the catalogue before
// anybody has asked. This is the one click that narrows to your own sizes,
// and clicking it again gives them all back.
el("mine-size").onclick = () => {
  const mine = facets?.mine?.sizes || [];
  const already = mine.length && mine.every(v => state.size.has(v));
  state.size = already ? new Set() : new Set(mine);
  reload();
};
el("more-size").onclick = () => { expanded.size = !expanded.size; reload(); };
el("more-brand").onclick = () => { expanded.brand = !expanded.brand; reload(); };

let typing;
el("q").oninput = e => {
  el("q-clear").hidden = !e.target.value;
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = e.target.value.trim(); reload(); }, 280);
};
el("q-clear").onclick = () => {
  el("q").value = ""; el("q-clear").hidden = true; state.q = ""; reload();
};
for (const [id, key] of [["pmin","min_price"], ["pmax","max_price"]]){
  el(id).onchange = e => { state[key] = e.target.value.trim(); reload(); };
}

(function start(){
  // ?product=N opens straight onto one thing, so a find can be sent to somebody
  // as a link rather than as a description of where to look.
  const wanted = new URLSearchParams(location.search).get("product");
  if (wanted) open_sheet(wanted);

  const seed = JSON.parse(el("seed").textContent).seed;
  const remembered = restore();
  // The server renders the first screenful from the query string, so the page
  // has to read it too — otherwise /?kids=1 paints the children's shelf and the
  // first fetch replaces it with the grown-up one.
  if (new URLSearchParams(location.search).get("kids") === "1") state.kids = true;
  el("sort").value = state.sort;
  el("pmin").value = state.min_price;
  el("pmax").value = state.max_price;

  const ready = f => {
    facets = f;
    facets_kids = state.kids;
    if (f.price && f.price.max)
      el("prange").textContent = `на полке ${money(f.price.min)} – ${money(f.price.max)}`;
    reload();
  };
  if (seed && !remembered){
    // Nothing chosen yet: the seed in the HTML is already the right answer.
    facets = seed.facets;
    facets_kids = state.kids;
    if (facets.price?.max)
      el("prange").textContent = `на полке ${money(facets.price.min)} – ${money(facets.price.max)}`;
    draw_active();
    draw_mine();
    chips("f-size", "size", facets.sizes, null, facets.mine?.sizes);
    chips("f-brand", "brand", facets.brands);
    chips("f-kind", "kind", facets.kinds, v => KIND_RU[v] || v, facets.mine?.kinds);
    chips("f-gender", "gender", facets.genders, v => GENDER_RU[v] || v, facets.mine?.genders);
    discount_chips();
    kids_chip();
    render(seed.offers, false);
  } else if (seed){
    ready(seed.facets);
  } else {
    fetch("/api/facets" + (state.kids ? "?kids=1" : "")).then(r => r.json()).then(ready);
  }
})();
</script>
