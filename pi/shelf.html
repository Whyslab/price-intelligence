<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скидки</title>
<!-- Deferred on purpose: it is only needed to sit nicely inside Telegram, and
     as a blocking script it holds up the whole shelf whenever telegram.org is
     slow — which, on a page opened from a phone on a bad connection, is often.
     Everything below treats it as optional. -->
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#fafaf9; --card:#fff; --ink:#1c1917; --dim:#78716c; --line:#e7e5e4;
  --accent:#166534; --hot:#b91c1c; --chip:#f5f5f4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c0a09; --card:#1c1917; --ink:#fafaf9; --dim:#a8a29e; --line:#292524;
         --accent:#4ade80; --hot:#f87171; --chip:#292524; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--bg);
       border-bottom:1px solid var(--line);padding:10px 12px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=search],select{
  font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px}
input[type=search]{flex:1 1 180px;min-width:0}
.count{color:var(--dim);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:inherit;
      border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.55;margin-left:4px}
main{display:grid;gap:10px;padding:12px;
     grid-template-columns:repeat(auto-fill,minmax(165px,1fr));max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.thumb{aspect-ratio:1;background:var(--chip);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:6px;left:6px;background:var(--hot);color:#fff;
       border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700}
.low{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--bg);
     border-radius:6px;padding:2px 6px;font-size:11px;font-weight:700}
.body{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.brand{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim)}
.name{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden}
.prices{display:flex;gap:6px;align-items:baseline;margin-top:auto;padding-top:5px}
.now{font-weight:700}
.then{color:var(--dim);text-decoration:line-through;font-size:12px}
.meta{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--dim)}
.stale{color:var(--hot)}
dialog{border:none;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 24px);
       background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{padding:16px 18px 18px}
.sheet h2{margin:0 0 2px;font-size:17px;line-height:1.25}
.sheet .brand{margin-bottom:10px}
.hero{display:flex;gap:12px;margin-bottom:12px}
.hero img{width:104px;height:104px;object-fit:cover;border-radius:9px;background:var(--chip);flex:0 0 auto}
.big{font-size:22px;font-weight:700}
.verdict{margin:10px 0 12px;padding:9px 11px;border-radius:9px;font-size:13px;line-height:1.4}
.verdict.best{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.verdict.beaten{background:color-mix(in srgb,var(--hot) 14%,transparent)}
.verdict.alone{background:var(--chip);color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:6px 2px;border-top:1px solid var(--line);vertical-align:baseline}
td.p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.us{font-weight:700}
tr.cheap td.p{color:var(--accent)}
.sizes{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.sz{border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}
.sz.out{opacity:.35;text-decoration:line-through}
.go{display:block;text-align:center;margin-top:14px;padding:11px;border-radius:10px;
    background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.close{position:absolute;top:8px;right:10px;border:none;background:none;
       color:var(--dim);font-size:26px;line-height:1;cursor:pointer}
#more{display:block;margin:16px auto 40px;padding:11px 26px;font:inherit;
      background:var(--card);color:inherit;border:1px solid var(--line);border-radius:10px}
.empty{padding:48px 16px;text-align:center;color:var(--dim);grid-column:1/-1}
</style>

<header>
  <div class="row">
    <input type="search" id="q" placeholder="Поиск: nike, cargo, carhartt…" autocomplete="off">
    <select id="sort">
      <option value="score">Лучшие</option>
      <option value="discount">Больше скидка</option>
      <option value="saving">Больше экономия</option>
      <option value="cheapest">Дешевле</option>
      <option value="newest">Новее</option>
      <option value="freshest">Свежее проверено</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="f-kind"></div>
  <div class="chips" id="f-gender"></div>
  <div class="chips" id="f-size"></div>
  <div class="chips" id="f-brand"></div>
</header>

<!-- The server drops the first page of results in here, so the shelf is on
     screen as the HTML is parsed instead of after two round trips. Nothing
     depends on it: with an empty seed the page fetches exactly as it would
     have. -->
<script type="application/json" id="seed">{"seed": null}</script>
<main id="grid"></main>
<button id="more" hidden>Показать ещё</button>
<dialog id="sheet"><button class="close" id="x" aria-label="Закрыть">×</button>
  <div class="sheet" id="sheet-body"></div></dialog>

<script>
// The Telegram bridge may not have arrived yet, and may never arrive: this
// page is equally a normal web page opened in a browser.
addEventListener("load", () => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
});
const KIND_RU = {shoes:"Обувь", clothing:"Одежда", accessories:"Аксессуары"};
const GENDER_RU = {men:"Мужское", women:"Женское"};
const state = {kind:new Set(), gender:new Set(), size:new Set(), brand:new Set(),
               q:"", sort:"score", page:0};
let total = 0;

const el = id => document.getElementById(id);
const money = n => "$" + n.toFixed(n < 100 ? 2 : 0);

function days(iso){
  const d = (Date.now() - new Date(iso).getTime()) / 86400000;
  return d;
}
function freshness(iso){
  const d = days(iso);
  if (d < 1) return {text:"сегодня", stale:false};
  if (d < 2) return {text:"вчера", stale:false};
  return {text:Math.floor(d) + " дн. назад", stale:d >= 4};
}

function chips(box, name, items, label){
  el(box).innerHTML = "";
  for (const it of items){
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", state[name].has(it.value));
    b.innerHTML = (label ? label(it.value) : it.value) + " <small>" + it.count + "</small>";
    b.onclick = () => {
      state[name].has(it.value) ? state[name].delete(it.value) : state[name].add(it.value);
      b.setAttribute("aria-pressed", state[name].has(it.value));
      reload();
    };
    el(box).append(b);
  }
}

function params(){
  const p = new URLSearchParams();
  for (const k of ["kind","gender","size","brand"])
    for (const v of state[k]) p.append(k, v);
  if (state.q) p.set("q", state.q);
  p.set("sort", state.sort);
  p.set("page", state.page);
  return p;
}

function card(o){
  const a = document.createElement("a");
  a.className = "card"; a.href = o.url; a.target = "_blank"; a.rel = "noopener";
  // The link is real, so middle-click and "open in new tab" still work; the
  // click is intercepted only to show what everyone else charges first.
  a.onclick = e => { e.preventDefault(); open_sheet(o.id); };
  const f = freshness(o.checked_at);
  a.innerHTML = `
    <div class="thumb">
      ${o.image ? `<img loading="lazy" src="${o.image}" alt="">` : ""}
      <span class="badge">−${o.discount}%</span>
      ${o.all_time_low ? `<span class="low">минимум</span>` : ""}
    </div>
    <div class="body">
      <div class="brand">${o.brand || o.shop}</div>
      <div class="name">${o.title}</div>
      <div class="prices"><span class="now">${money(o.price)}</span>
        <span class="then">${money(o.was)}</span></div>
      <div class="meta"><span>${o.size || "—"}</span><span>${o.shop}</span></div>
      <div class="meta"><span class="${f.stale ? "stale" : ""}">${f.text}</span>
        <span>−${money(o.saving)}</span></div>
    </div>`;
  return a;
}

function render(data, append){
  total = data.total;
  el("count").textContent = total.toLocaleString("ru") + " шт.";
  if (!append) el("grid").innerHTML = "";
  if (!data.offers.length && !append)
    el("grid").innerHTML = `<div class="empty">Ничего не нашлось.<br>Снимите часть фильтров.</div>`;
  for (const o of data.offers) el("grid").append(card(o));
  el("more").hidden = state.page + 1 >= data.pages;
}

async function load(append){
  render(await (await fetch("/api/offers?" + params())).json(), append);
}

function shop_row(o, mine, cheapest){
  const cls = o === mine ? "us" : (cheapest && o.price === cheapest.price ? "cheap" : "");
  const where = o.shop + (o.country ? " · " + o.country : "");
  return `<tr class="${cls}"><td>${o === mine ? "здесь — " : ""}${where}</td>
          <td class="p">${money(o.price)}</td></tr>`;
}

async function open_sheet(id){
  const d = el("sheet");
  el("sheet-body").innerHTML = "<p style='color:var(--dim)'>Смотрю, у кого ещё это есть…</p>";
  d.showModal();
  const r = await fetch("/api/product/" + id);
  if (!r.ok) { el("sheet-body").innerHTML = "<p>Это предложение уже сняли с полки.</p>"; return; }
  const {ours, sizes, elsewhere, cheapest_elsewhere: cheap} = await r.json();

  let verdict;
  if (!elsewhere.length)
    verdict = `<div class="verdict alone">Этот артикул больше нигде не найден —
               сравнить не с чем. Скидка посчитана от ${ours.source === "tag"
               ? "перечёркнутой цены магазина" : "прежней цены"}.</div>`;
  else if (cheap)
    verdict = `<div class="verdict beaten">Дешевле в ${cheap.shop}:
               <b>${money(cheap.price)}</b> — на ${money(ours.price - cheap.price)} меньше.</div>`;
  else if (elsewhere[0].price <= ours.price)
    // Nobody is cheaper, but somebody matches. "Cheapest here" would be a
    // shade stronger than the truth, and the page is only worth anything if
    // it never is.
    verdict = `<div class="verdict best">Столько же в ${elsewhere[0].shop}.
               Дороже нигде не нашлось меньше — всего ${elsewhere.length}
               магазин(ов) с этим артикулом.</div>`;
  else
    verdict = `<div class="verdict best">Дешевле всего здесь: следующая цена —
               ${money(elsewhere[0].price)} в ${elsewhere[0].shop}, это на
               ${money(elsewhere[0].price - ours.price)} больше.</div>`;

  const all = [...elsewhere, ours].sort((a, b) => a.price - b.price);
  const have = sizes.filter(s => s.in_stock), gone = sizes.filter(s => !s.in_stock);

  el("sheet-body").innerHTML = `
    <div class="hero">
      ${ours.image ? `<img src="${ours.image}" alt="">` : ""}
      <div>
        <div class="brand">${ours.brand || ""}</div>
        <h2>${ours.title}</h2>
        <div class="prices"><span class="big">${money(ours.price)}</span>
          <span class="then">${money(ours.was)}</span>
          <span class="badge" style="position:static">−${ours.discount}%</span></div>
      </div>
    </div>
    ${verdict}
    ${have.length || gone.length ? `<div class="sizes">
      ${have.map(s => `<span class="sz">${s.size}</span>`).join("")}
      ${gone.map(s => `<span class="sz out">${s.size}</span>`).join("")}
    </div>` : ""}
    ${elsewhere.length ? `<table>${all.map(o => shop_row(o, ours, cheap)).join("")}</table>` : ""}
    <a class="go" href="${ours.url}" target="_blank" rel="noopener">Открыть в ${ours.shop}</a>`;
}

el("x").onclick = () => el("sheet").close();
el("sheet").onclick = e => { if (e.target === el("sheet")) el("sheet").close(); };

function reload(){ state.page = 0; load(false); }

el("more").onclick = () => { state.page++; load(true); };
el("sort").onchange = e => { state.sort = e.target.value; reload(); };
let typing;
el("q").oninput = e => {
  clearTimeout(typing);
  typing = setTimeout(() => { state.q = e.target.value.trim(); reload(); }, 300);
};

function paint(facets, data){
  chips("f-kind", "kind", facets.kinds, v => KIND_RU[v] || v);
  chips("f-gender", "gender", facets.genders, v => GENDER_RU[v] || v);
  chips("f-size", "size", facets.sizes.slice(0, 40));
  chips("f-brand", "brand", facets.brands.slice(0, 40));
  render(data, false);
}

(function start(){
  // ?product=N opens straight onto one thing, so a find can be sent to
  // somebody as a link rather than as a description of where to look.
  const wanted = new URLSearchParams(location.search).get("product");
  if (wanted) open_sheet(wanted);
  const seed = JSON.parse(el("seed").textContent).seed;
  if (seed) { paint(seed.facets, seed.offers); return; }
  Promise.all([
    fetch("/api/facets").then(r => r.json()),
    fetch("/api/offers?" + params()).then(r => r.json()),
  ]).then(([f, d]) => paint(f, d));
})();
</script>
